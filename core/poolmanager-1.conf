# This poolmanager setup simulates one main site with core domain and one pool 
# as well as a remote site in a different network. requests coming from the remote door 
# should be directed to the remote pool only

# catch-all units (required, matches all IPs)
psu create unit -protocol */*
psu create unit -store *@*

# remote site subnet (10.2.0.0/16)
psu create unit -net 10.2.0.0/16

# main subnet
psu create unit -net 172.18.0.10/16

# unit groups
psu create ugroup all-net
psu addto ugroup all-net 10.2.0.0/16
psu addto ugroup all-net 172.18.0.10/16

psu create ugroup remote-net
psu addto ugroup remote-net 10.2.0.0/16

psu create ugroup main-net
psu addto ugroup main-net 172.18.0.10/16

psu create ugroup any-protocol
psu addto ugroup any-protocol */*

psu create ugroup any-store
psu addto ugroup any-store *@*

# pool groups (pools join dynamically when they register)
psu create pgroup remote-pools -dynamic -tags=zone=remote
psu create pgroup main-pools -dynamic -tags=zone=main
psu create pgroup all-pools -dynamic

# links
psu create link remote-link remote-net any-protocol any-store
psu create link main-link main-net any-protocol any-store

# higher prefs so if default is in the race this will still win
psu set link remote-link -writepref=20 -readpref=20 -cachepref=20 -p2ppref=20 
psu addto link remote-link remote-pools
psu set link main-link -writepref=20 -readpref=20 -cachepref=20 -p2ppref=20 
psu addto link main-link main-pools

psu create link default-link all-net any-protocol any-store
psu set link default-link -writepref=10 -readpref=10 -cachepref=10 -p2ppref=10
psu addto link default-link all-pools