---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcache-common
  namespace: dcache-fuse
data:
  dcache.conf: |
    dcache.enable.space-reservation = false
    dcache.enable.kafka = false

    dcache.zookeeper.connection = zk:2181

    dcache.layout = docker-layout
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcache-core-config
  namespace: dcache-fuse
data:
  docker-layout.conf: |
    chimera.db.user=postgres
    chimera.db.password=let-me-in
    chimera.db.host=pg
    chimera.db.name=chimera

    [core]
    dcache.broker.scheme = core
    dcache.zone = main

    [core/admin]

    [core/poolmanager]
    poolmanager.setup.file=/opt/dcache/etc/poolmanager.conf

    [core/pnfsmanager]
    chimera.db.url=jdbc:postgresql://${chimera.db.host}/${chimera.db.name}?ApplicationName=${pnfsmanager.cell.name}

    [core/cleaner-disk]
    chimera.db.url=jdbc:postgresql://${chimera.db.host}/${chimera.db.name}?ApplicationName=cleaner-disk

    [core/gplazma]

    [core/httpd]

    [core/webdav]
    webdav.net.port=8080
    webdav.authz.anonymous-operations=FULL
    webdav.authn.basic=false
    webdav.redirect.on-write=false
    webdav.redirect.on-read=false

    [core/nfs]
    nfs.version=4.1
    nfs.export.file=/opt/dcache/etc/exports

    [core/frontend]
    frontend.authn.protocol=http
    frontend.authz.anonymous-operations=FULL


  gplazma.conf: |
    auth    sufficient  htpasswd
    auth    sufficient  multimap
    map     sufficient  multimap
    session sufficient  omnisession

  htpasswd: |
    admin:$apr1$zBKqi.CP$4vmPVWHoSnUqmqe5NN2yO/

  multi-mapfile: |
    username:admin uid:0 gid:0

  omnisession.conf: |
    * root:/ home:/

  exports: |
    / *(rw,no_root_squash)

  authorized_keys2: |
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIATjdmjDnjGrRiYQGHEZdHybBhWP+3aSglZZuPWqcGnv lennart.sack@icloud.com

  poolmanager.conf: |
    # NOTE: the network units below use Docker bridge CIDRs (172.18.0.0/16,
    # 10.2.0.0/16). In Kubernetes all pods share a flat network so the
    # zone-specific read links won't match client IPs. Writes and the
    # default-link still work. Update the net units to your K8s pod CIDR
    # to restore zone-aware reads.

    psu create unit -net 0.0.0.0/0.0.0.0
    psu create unit -net ::/0
    psu create unit -protocol */*
    psu create unit -store *@*

    psu create unit -net 10.2.0.0/16
    psu create unit -net 172.18.0.0/16

    psu create ugroup all-net
    psu addto ugroup all-net 0.0.0.0/0.0.0.0
    psu addto ugroup all-net ::/0
    psu addto ugroup all-net 10.2.0.0/16
    psu addto ugroup all-net 172.18.0.0/16

    psu create ugroup remote-net
    psu addto ugroup remote-net 10.2.0.0/16

    psu create ugroup main-net
    psu addto ugroup main-net 172.18.0.0/16

    psu create ugroup any-protocol
    psu addto ugroup any-protocol */*

    psu create ugroup any-store
    psu addto ugroup any-store *@*

    psu create pgroup main-pools -dynamic -tags=zone=main
    psu create pgroup remote-pools -dynamic -tags=zone=remote

    psu create link write-link all-net any-protocol any-store
    psu set link write-link -writepref=10 -readpref=0 -cachepref=0 -p2ppref=0
    psu addto link write-link main-pools
    psu addto link write-link remote-pools

    psu create link main-read-link main-net any-protocol any-store
    psu set link main-read-link -writepref=0 -readpref=20 -cachepref=20 -p2ppref=20
    psu addto link main-read-link main-pools

    psu create link remote-read-link remote-net any-protocol any-store
    psu set link remote-read-link -writepref=0 -readpref=20 -cachepref=20 -p2ppref=20
    psu addto link remote-read-link remote-pools

    psu create link default-link all-net any-protocol any-store
    psu set link default-link -writepref=0 -readpref=10 -cachepref=10 -p2ppref=10
    psu addto link default-link main-pools
    psu addto link default-link remote-pools
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pool-main-config
  namespace: dcache-fuse
data:
  docker-layout.conf: |
    pool.plugins.meta=org.dcache.pool.repository.meta.db.BerkeleyDBMetaDataRepository
    pool.tags=hostname=${host.name} zone=main

    [${host.name}]
    dcache.zone = main

    [${host.name}/pool]
    pool.name=pool-${host.name}
    pool.path=/pool
    pool.mover.nfs.port.min=32049
    pool.mover.nfs.port.max=32049
    pool.mover.xrootd.port.min=31094
    pool.mover.xrootd.port.max=31094
    pool.mover.http.port.min=38080
    pool.mover.http.port.max=38090
    pool.mover.https.port.min=38443
    pool.mover.https.port.max=38453
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pool-remote-config
  namespace: dcache-fuse
data:
  docker-layout.conf: |
    chimera.db.user=postgres
    chimera.db.password=let-me-in
    chimera.db.host=pg
    chimera.db.name=chimera

    pool.plugins.meta=org.dcache.pool.repository.meta.db.BerkeleyDBMetaDataRepository
    pool.tags=hostname=${host.name} zone=remote

    [${host.name}]
    dcache.zone = remote

    [${host.name}/pool]
    pool.name=pool-${host.name}
    pool.path=/pool
    pool.mover.nfs.port.min=32049
    pool.mover.nfs.port.max=32049
    pool.mover.xrootd.port.min=31094
    pool.mover.xrootd.port.max=31094
    pool.mover.http.port.min=38080
    pool.mover.http.port.max=38090
    pool.mover.https.port.min=38443
    pool.mover.https.port.max=38453

    [${host.name}/nfs]
    nfs.version=4.1
    nfs.export.file=/opt/dcache/etc/exports

    [${host.name}/webdav]
    webdav.net.port=8180
    webdav.authz.anonymous-operations=FULL
    webdav.authn.basic=false
    webdav.redirect.on-write=false
    webdav.redirect.on-read=false

  exports: |
    / *(rw,no_root_squash)
