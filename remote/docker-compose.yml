version: '3'
services:

  dcache-pool:
    image: dcache/dcache:11.0
    hostname: remote-node-1
    networks:
      dcache:
      remote-net:
        ipv4_address: 10.2.0.10
    ports:
      - "8180:8180"
    volumes:
      - ../common/dcache.conf:/opt/dcache/etc/dcache.conf
      - ./docker-layout.conf:/opt/dcache/etc/layouts/docker-layout.conf
      - ./data:/pool

networks:
  dcache:
    external: true
    name: dcache
  remote-net:
    external: true
    name: remote-net
