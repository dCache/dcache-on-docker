services:

  dcache-pool:
    image: dcache/dcache:latest
    pull_policy: never
    hostname: remote-1
    networks:
      dcache:
        ipv4_address: 172.18.0.10
      remote-net:
        ipv4_address: 10.2.0.10
    ports:
      - "8180:8180"
      - "2149:2049"
    volumes:
      - ../common/dcache.conf:/opt/dcache/etc/dcache.conf
      - ./exports:/opt/dcache/etc/exports
      - ./docker-layout.conf:/opt/dcache/etc/layouts/docker-layout.conf
      - ./data:/pool

networks:
  dcache:
    external: true
    name: dcache
  remote-net:
    external: true
    name: remote-net